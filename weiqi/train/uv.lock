    { name = "torch", version = "2.14.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux'" },
    { name = "torch", version = "2.14.0+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux'" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "numpy", specifier = "==2.5.2" },
    { name = "torch", marker = "sys_platform != 'linux'", specifier = ">=2.14,<2.15" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.14,<2.15", index = "https://download.pytorch.org/whl/cpu" },
]

[package.metadata.requires-dev]
dev = [
    { name = "mypy" },
    { name = "pytest", specifier = ">=8" },
]
