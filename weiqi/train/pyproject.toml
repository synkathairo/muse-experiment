# mypy + numpy are build requirements so `uv sync` / `uv pip install .`
# compile gotrain/rules.py with mypyc by default (see setup.py): uv installs
# these into the isolated build env automatically. Opt out of the compiled
# extension with WEIQI_PURE_PYTHON=1 (pure-Python install, no C compiler needed).
[build-system]
requires = ["setuptools", "mypy", "numpy==2.5.2"]
build-backend = "setuptools.build_meta"

[project]
name = "weiqi-train"
version = "0.1.0"
description = "Training package for the 9x9 Go demo nets (self-play PPO + supervised cloning)"
requires-python = ">=3.12"
dependencies = [
    # Version range (not ==): the Linux CPU-only index tags its builds
    # 2.14.0+cpu, which ==2.14.0 would not match (PEP 440). The uv.lock
    # records the exact artifact per platform, so `uv sync` stays
    # bit-for-bit reproducible.
    "torch>=2.14,<2.15",
    "numpy==2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Needed for manual rebuilds: python setup.py build_ext --inplace
    # (uv also provides it to the isolated build env via [build-system]).
    "mypy",
]

# PyPI's Linux torch wheels bundle CUDA (~2.5GB) even on CPU-only boxes.
# Route Linux to PyTorch's CPU-only index; macOS keeps the PyPI wheel
# (MPS included, ~200MB). explicit=true so only torch uses this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
# Minimal: catch real bugs, not style nits. Research code moves fast.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "F",   # pyflakes: unused imports/vars, undefined names, etc.
    "E4", "E7", "E9",  # pycodestyle errors (not style nits)
    "B",   # flake8-bugbear: likely bugs
]
ignore = [
    "E741",  # ambiguous variable names (l, O, I) — fine in research code
    "B008",  # function call in default arg — sometimes intentional
    "B023",  # loop var in closure — false positives in gtp.py (called immediately)
    "B007",  # unused loop control var — harmless in research code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # unused local vars ok in tests
