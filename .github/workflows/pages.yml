# Deploy the web/site folder to GitHub Pages.
# Prerequisites (done by the repo owner, the app token lacks admin scope):
#   1. Repo is public (Pages on private repos needs a paid plan).
#   2. Settings -> Pages -> Source: GitHub Actions.
# Afterwards every push touching web/site redeploys automatically.
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/site/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
