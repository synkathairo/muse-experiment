name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/site/**'
      - 'web/src/**'
      - 'fluid-sim/**'
      - 'audio-dsp/**'
      - 'weiqi/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build zk WASM demo
        run: wasm-pack build --target web --out-dir ../../site/demos/zk/pkg
        working-directory: web/src/zk-wasm

      - name: Build fluid WASM demo
        run: wasm-pack build --target web --out-dir ../../site/demos/fluid/pkg
        working-directory: web/src/fluid-wasm

      - name: Build audio WASM demo
        run: wasm-pack build --target web --out-dir ../../site/demos/audio/pkg
        working-directory: web/src/audio-wasm

      - name: Build weiqi WASM demo
        run: wasm-pack build --target web --out-dir ../../site/demos/go/pkg
        working-directory: web/src/weiqi-wasm
        env:
          # f32x4 for the hand-rolled conv kernel (2x inference speedup)
          RUSTFLAGS: "-C target-feature=+simd128"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4